<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — TERRITORIA Mutuelle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Quill.js WYSIWYG Editor -->
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- LOGIN -->
  <div class="admin-login" id="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" width="48" height="48">
          <rect width="40" height="40" rx="8" fill="#C8102E"/>
          <path d="M10 14h20v3H10zM10 20h14v3H10zM10 26h18v3H10z" fill="white"/>
        </svg>
        <h1>TERRITORIA <span>Mutuelle</span></h1>
        <p>Panneau d'administration</p>
      </div>
      <div class="login-form">
        <label for="github-token">Token GitHub</label>
        <input type="password" id="github-token" placeholder="ghp_xxxxxxxxxxxx">
        <p class="login-hint">Votre token GitHub avec accès au repo Solayia/territoria-mutuelle</p>
        <button class="btn-admin btn-admin-primary" id="login-btn">Se connecter</button>
        <div class="login-error" id="login-error" style="display:none;"></div>
      </div>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div class="admin-panel" id="admin-panel" style="display:none;">

    <!-- SIDEBAR -->
    <aside class="admin-sidebar">
      <div class="sidebar-logo">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" width="32" height="32">
          <rect width="40" height="40" rx="8" fill="#C8102E"/>
          <path d="M10 14h20v3H10zM10 20h14v3H10zM10 26h18v3H10z" fill="white"/>
        </svg>
        <span>Admin</span>
      </div>
      <nav class="sidebar-nav">
        <button class="sidebar-btn sidebar-active" data-view="dashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Articles
        </button>
        <button class="sidebar-btn" data-view="editor">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Nouvel article
        </button>
      </nav>
      <div class="sidebar-footer">
        <a href="../index.html" target="_blank" class="sidebar-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          Voir le site
        </a>
        <button class="sidebar-link" id="logout-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Déconnexion
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="admin-main">

      <!-- DASHBOARD VIEW -->
      <div class="admin-view" id="view-dashboard">
        <div class="admin-header">
          <h2>Articles publiés</h2>
          <button class="btn-admin btn-admin-primary" id="new-article-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Nouvel article
          </button>
        </div>
        <div class="articles-list" id="articles-list">
          <div class="admin-loading">Chargement des articles...</div>
        </div>
      </div>

      <!-- EDITOR VIEW -->
      <div class="admin-view" id="view-editor" style="display:none;">
        <div class="admin-header">
          <h2 id="editor-title">Nouvel article</h2>
          <div class="editor-actions">
            <button class="btn-admin btn-admin-outline" id="cancel-btn">Annuler</button>
            <button class="btn-admin btn-admin-primary" id="publish-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              Publier
            </button>
          </div>
        </div>

        <div class="editor-form">
          <div class="editor-row">
            <div class="editor-field editor-field-wide">
              <label for="field-title">Titre de l'article *</label>
              <input type="text" id="field-title" placeholder="Ex: Prévention des TMS : 5 gestes essentiels">
            </div>
          </div>
          <div class="editor-row">
            <div class="editor-field">
              <label for="field-category">Catégorie *</label>
              <select id="field-category">
                <option value="Prévention">Prévention</option>
                <option value="QVCT">QVCT</option>
                <option value="Actualités">Actualités</option>
                <option value="Formations">Formations</option>
              </select>
            </div>
            <div class="editor-field">
              <label for="field-date">Date de publication</label>
              <input type="date" id="field-date">
            </div>
            <div class="editor-field">
              <label for="field-author">Auteur</label>
              <input type="text" id="field-author" value="TERRITORIA Mutuelle">
            </div>
          </div>
          <div class="editor-row">
            <div class="editor-field editor-field-wide">
              <label for="field-image">URL de l'image de couverture</label>
              <input type="url" id="field-image" placeholder="https://images.unsplash.com/photo-...">
              <p class="field-hint">Utilisez une image Unsplash (libre de droit). Format recommandé : 1200x600px</p>
            </div>
          </div>
          <div class="editor-row">
            <div class="editor-field editor-field-wide">
              <label for="field-excerpt">Extrait / résumé (affiché dans les listes) *</label>
              <textarea id="field-excerpt" rows="3" placeholder="Résumé de l'article en 1-2 phrases..."></textarea>
            </div>
          </div>
          <div class="editor-row">
            <div class="editor-field editor-field-wide">
              <label>Contenu de l'article *</label>
              <div id="quill-editor"></div>
            </div>
          </div>
        </div>

        <!-- STATUS -->
        <div class="editor-status" id="editor-status" style="display:none;"></div>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
  <script src="admin.js"></script>
</body>
</html>
