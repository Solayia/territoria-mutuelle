<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" role="img" aria-label="Groupe APICIL">
  <defs>
    <linearGradient id="apicilG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E2001A"/>
      <stop offset="1" stop-color="#9E0A12"/>
    </linearGradient>
  </defs>
  <!-- Symbole : carré rouge dégradé + fenêtre carrée blanche -->
  <rect x="8" y="8" width="84" height="84" rx="1.5" fill="url(#apicilG)"/>
  <rect x="30" y="30" width="40" height="40" fill="#ffffff"/>
  <rect x="38" y="38" width="24" height="24" fill="url(#apicilG)"/>
  <!-- Marque -->
  <text x="110" y="69" font-family="Poppins, 'Arial Black', Arial, sans-serif" font-size="60" font-weight="800" letter-spacing="1.5" fill="#E2001A">APICIL</text>
</svg>
